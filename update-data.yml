name: Update sports data

on:
  schedule:
    - cron: "0 12 * * *"            # every day at 12:00 UTC
    - cron: "0 16,20 * * 0,1,4"     # extra runs on Sun, Mon, Thu (NFL game days)
    - cron: "0 22 * * *"            # evening refresh at 22:00 UTC
  workflow_dispatch:                 # lets you run it by hand from the Actions tab

permissions:
  contents: write
  pages: write

concurrency:
  group: update-sports-data
  cancel-in-progress: false

jobs:
  nfl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install nflreadpy pandas pyarrow
      - name: Build NFL data
        id: build
        continue-on-error: true
        run: |
          mkdir -p data
          python build_data.py 2>&1 | tee data/log.txt
          exit ${PIPESTATUS[0]}
      - name: Save results
        run: |
          git config user.name "statline-bot"
          git config user.email "statline-bot@users.noreply.github.com"
          git add data
          git commit -m "Update NFL data" || exit 0
          git pull --rebase -X theirs origin main
          git push
      - name: Fail if the build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

  nba:
    needs: nfl
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install sportsdataverse pandas pyarrow
      - name: Build NBA data
        id: build
        continue-on-error: true
        run: |
          mkdir -p data
          python build_nba.py 2>&1 | tee data/nba_log.txt
          exit ${PIPESTATUS[0]}
      - name: Save results
        run: |
          git config user.name "statline-bot"
          git config user.email "statline-bot@users.noreply.github.com"
          git add data
          git commit -m "Update NBA data" || exit 0
          git pull --rebase -X theirs origin main
          git push
      - name: Fail if the build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

  nhl:
    needs: nba
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install pandas
      - name: Build NHL data
        id: build
        continue-on-error: true
        run: |
          mkdir -p data
          python build_nhl.py 2>&1 | tee data/nhl_log.txt
          exit ${PIPESTATUS[0]}
      - name: Save results
        run: |
          git config user.name "statline-bot"
          git config user.email "statline-bot@users.noreply.github.com"
          git add data
          git commit -m "Update NHL data" || exit 0
          git pull --rebase -X theirs origin main
          git push
      - name: Refresh the website
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "/repos/${{ github.repository }}/pages/builds"
      - name: Fail if the build failed
        if: steps.build.outcome == 'failure'
        run: exit 1
